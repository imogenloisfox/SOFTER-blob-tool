<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 16px;
  background-color: #121212;
  color: #e0e0e0;
  font-family: 'Alte Haas Grotesk', sans-serif, system-ui;
  font-size: 11px;
}

.app-container {
  display: flex;
  flex-direction: row;
  gap: 16px;
  max-width: 1600px;
  margin: 0 auto;
}

/* Sidebar Tool Panel */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Drawing / Preview Area */
.main-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 12px;
}

.card-title {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  color: #888;
}

.control-group {
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.control-group label {
  font-size: 10px;
  color: #aaa;
  display: flex;
  justify-content: space-between;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

input[type="range"] {
  width: 100%;
  height: 4px;
  accent-color: #ffffff;
  cursor: pointer;
}

input[type="number"] {
  width: 45px;
  background: #2a2a2a;
  border: 1px solid #444;
  color: #fff;
  border-radius: 4px;
  padding: 2px 4px;
  font-size: 10px;
  text-align: right;
}

/* Workspace Panels */
.bubble {
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 16px;
}

#canvas-container {
  width: 100%;
  min-height: 480px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
}

svg {
  max-width: 100%;
  height: auto;
  display: block;
}

textarea {
  width: 100%;
  height: 120px;
  background: #181818;
  border: 1px solid #333;
  color: #00ffcc;
  font-family: monospace;
  font-size: 10px;
  padding: 8px;
  border-radius: 4px;
  resize: vertical;
}

button {
  background: #2e2e2e;
  border: 1px solid #444;
  color: #fff;
  padding: 6px 12px;
  font-size: 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #3e3e3e;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Stacked Sidebar Tools -->
  <div class="sidebar">
    <div class="card">
      <div class="card-title">Grid & Blob Controls</div>

      <div class="control-group">
        <label for="grid-spacing">Grid Spacing <span id="val-grid">20</span></label>
        <div class="slider-row">
          <input type="range" id="grid-spacing" min="5" max="100" value="20" oninput="updateVal('grid', this.value)">
          <input type="number" value="20" min="5" max="100" onchange="updateSlider('grid-spacing', this.value)">
        </div>
      </div>

      <div class="control-group">
        <label for="blob-size">Blob Radius <span id="val-size">15</span></label>
        <div class="slider-row">
          <input type="range" id="blob-size" min="2" max="50" value="15" oninput="updateVal('size', this.value)">
          <input type="number" value="15" min="2" max="50" onchange="updateSlider('blob-size', this.value)">
        </div>
      </div>

      <div class="control-group">
        <label for="blur-amount">Soft Blur <span id="val-blur">0</span></label>
        <div class="slider-row">
          <input type="range" id="blur-amount" min="0" max="20" value="0" oninput="updateVal('blur', this.value)">
          <input type="number" value="0" min="0" max="20" onchange="updateSlider('blur-amount', this.value)">
        </div>
      </div>

      <div class="control-group">
        <label for="randomness">Randomness <span id="val-rand">5</span></label>
        <div class="slider-row">
          <input type="range" id="randomness" min="0" max="30" value="5" oninput="updateVal('rand', this.value)">
          <input type="number" value="5" min="0" max="30" onchange="updateSlider('randomness', this.value)">
        </div>
      </div>

      <div style="margin-top: 12px;">
        <button onclick="generateGrid()">Regenerate Grid</button>
      </div>
    </div>
  </div>

  <!-- Expanded Drawing & Code Output Space -->
  <div class="main-content">
    <!-- Bubble 1: Visual Canvas Output -->
    <div class="bubble">
      <div class="card-title">Drawing Space</div>
      <div id="canvas-container">
        <!-- SVG content generated by JS -->
        <svg id="blob-svg" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
          <filter id="svg-blur">
            <feGaussianBlur stdDeviation="0" />
          </filter>
          <g id="grid-group" filter="url(#svg-blur)"></g>
        </svg>
      </div>
    </div>

    <!-- Bubble 2: Exportable Text/Code Bubble -->
    <div class="bubble">
      <div class="card-title">SVG Output Code</div>
      <textarea id="svg-output" readonly></textarea>
    </div>
  </div>
</div>

<script>
function updateVal(id, val) {
  document.getElementById('val-' + id).innerText = val;
  const slider = event.target;
  const numInput = slider.nextElementSibling;
  if (numInput) numInput.value = val;
  generateGrid();
}

function updateSlider(sliderId, val) {
  const slider = document.getElementById(sliderId);
  slider.value = val;
  const valSpan = slider.previousElementSibling.querySelector('span');
  if (valSpan) valSpan.innerText = val;
  generateGrid();
}

function generateGrid() {
  const spacing = parseInt(document.getElementById('grid-spacing').value);
  const radius = parseInt(document.getElementById('blob-size').value);
  const blur = parseInt(document.getElementById('blur-amount').value);
  const rand = parseInt(document.getElementById('randomness').value);

  const group = document.getElementById('grid-group');
  const blurFilter = document.querySelector('#svg-blur feGaussianBlur');
  
  blurFilter.setAttribute('stdDeviation', blur);
  group.innerHTML = '';

  const width = 600;
  const height = 400;

  for (let x = spacing; x < width; x += spacing) {
    for (let y = spacing; y < height; y += spacing) {
      const offsetX = (Math.random() - 0.5) * rand;
      const offsetY = (Math.random() - 0.5) * rand;
      
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', x + offsetX);
      circle.setAttribute('cy', y + offsetY);
      circle.setAttribute('r', radius);
      circle.setAttribute('fill', '#ffffff');
      group.appendChild(circle);
    }
  }

  const svg = document.getElementById('blob-svg');
  document.getElementById('svg-output').value = svg.outerHTML;
}

// Initial draw
generateGrid();
</script>

</body>
</html>
